apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 70
      containers:
        - name: web
          image: consortium-backend:k8s1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: backend-env
          env:
            - name: DB_HOST
              value: db
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            periodSeconds: 5
