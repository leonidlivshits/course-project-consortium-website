apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: consortium-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: consortium
spec:
  gatewayClassName: consortium-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: consortium-frontend
spec:
  parentRefs:
    - name: consortium
  rules:
    - backendRefs:
        - name: frontend
          port: 80
