apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: consortium-api
spec:
  parentRefs:
    - name: consortium
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/news
          method: GET
      backendRefs:
        - name: web-v1
          port: 80
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Demo-Route
                value: shadow
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: web-v2
              port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Demo-Route
                value: shadow
      backendRefs:
        - name: web-v1
          port: 80
