apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: consortium-api
spec:
  parentRefs:
    - name: consortium
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - type: Exact
              name: X-User-Group
              value: beta
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Demo-Route
                value: ab
      backendRefs:
        - name: web-v2
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Demo-Route
                value: ab
      backendRefs:
        - name: web-v1
          port: 80
