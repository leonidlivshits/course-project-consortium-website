server:
  retentionPeriod: 7d
  persistentVolume:
    size: 1Gi
  scrape:
    enabled: true
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: victoria-metrics
          static_configs:
            - targets: [localhost:8428]
        - job_name: frontend-probe
          metrics_path: /probe
          params:
            module: [http_204]
          static_configs:
            - targets:
                - http://frontend.default.svc:80/api/health
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter.default.svc:9115
        - job_name: application-pods
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [default]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_container_port_number
              action: keep_if_equal
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_label_app]
              target_label: app
        - job_name: kubernetes-cadvisor
          scheme: https
          honor_timestamps: false
          kubernetes_sd_configs:
            - role: node
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          relabel_configs:
            - source_labels: [__meta_kubernetes_node_name]
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
            - target_label: __address__
              replacement: kubernetes.default.svc:443
          metric_relabel_configs:
            - source_labels: [__name__, namespace, container]
              action: keep
              regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes);default;web'
